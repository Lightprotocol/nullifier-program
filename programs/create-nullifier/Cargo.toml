[package]
name = "light-nullifier-program"
version = "0.1.2"
description = "Nullifier program and SDK for Light Protocol ZK compression on Solana"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Lightprotocol/nullifier-program"
homepage = "https://github.com/Lightprotocol/nullifier-program"
keywords = ["solana", "light-protocol", "zk-compression", "nullifier"]
categories = ["cryptography", "no-std"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "lib"]
name = "light_nullifier_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["idl-build"]
test-sbf = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
light-sdk = { version = "0.19.0", features = ["anchor", "anchor-discriminator", "cpi-context"] }
light-hasher = "5.0.0"

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-sdk = "2.2"
light-program-test = "0.19.0"

[dev-dependencies]
light-client = "0.19.0"
tokio = "1.36.0"
blake3 = "=1.8.2"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
